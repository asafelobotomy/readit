# Creates a GitHub Release when extension/package.json version changes on main.
# Artifact: dist/readit-<version>-chrome.zip (Load unpacked or sideload via unzip).

name: Release

on:
  push:
    branches: [main, master]
    paths:
      - "extension/package.json"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version extension/package.json)"
          # Strict semver-ish: the value becomes a tag and a release title.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          TAG="v${VERSION}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          PREV=""
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            PREV="$(git show HEAD^:extension/package.json 2>/dev/null | jq -r .version // empty || true)"
          fi
          echo "previous=${PREV}" >> "$GITHUB_OUTPUT"

          if [[ -n "$PREV" && "$PREV" == "$VERSION" ]]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "extension/package.json changed but version is still ${VERSION} — skipping release"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version bump: ${PREV:-none} → ${VERSION}"
          fi

      - name: Setup Node
        if: steps.ver.outputs.bumped == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        if: steps.ver.outputs.bumped == 'true'
        run: npm ci

      - name: Versions in sync
        if: steps.ver.outputs.bumped == 'true'
        run: npm run check:versions

      - name: Typecheck
        if: steps.ver.outputs.bumped == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.ver.outputs.bumped == 'true'
        run: npm test

      - name: Build + zip Chrome MV3
        if: steps.ver.outputs.bumped == 'true'
        run: npm run zip

      - name: Create GitHub Release
        if: steps.ver.outputs.bumped == 'true'
        # Step outputs go through env, never `${{ }}` inside the script, so
        # their contents can't be parsed as shell.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZIP="dist/readit-${VERSION}-chrome.zip"
          test -f "$ZIP"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — refusing to overwrite"
            exit 1
          fi

          gh release create "$TAG" "$ZIP" \
            --title "readit ${VERSION}" \
            --generate-notes \
            --target "$TARGET_SHA"
