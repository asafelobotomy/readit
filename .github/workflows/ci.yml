# Gates every push and pull request with typecheck + unit tests + build,
# independent of the release workflow (which only runs on a version bump).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Third-party actions are pinned to commit SHAs (tag noted alongside) so a
# moved tag can't change what runs; bump both together.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Versions in sync
        run: npm run check:versions

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
