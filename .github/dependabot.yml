# Keeps the SHA-pinned workflow actions current (Dependabot rewrites the
# pin and its `# vX.Y.Z` comment together). npm security updates are
# handled by Dependabot security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
